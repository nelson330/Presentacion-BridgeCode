<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHamaca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bgHamaca)"/>

  <!-- Wooden Spreader Bars -->
  <rect x="40" y="70" width="12" height="160" rx="4" fill="#78350F" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="248" y="70" width="12" height="160" rx="4" fill="#78350F" stroke="#FDE68A" stroke-width="1.5"/>
  
  <!-- Suspension ropes -->
  <path d="M 15 150 L 40 85 M 15 150 L 40 120 M 15 150 L 40 150 M 15 150 L 40 180 M 15 150 L 40 215" stroke="#FDE68A" stroke-width="2"/>
  <circle cx="15" cy="150" r="6" fill="#D97706" stroke="#FEF3C7" stroke-width="2"/>

  <path d="M 285 150 L 260 85 M 285 150 L 260 120 M 285 150 L 260 150 M 285 150 L 260 180 M 285 150 L 260 215" stroke="#FDE68A" stroke-width="2"/>
  <circle cx="285" cy="150" r="6" fill="#D97706" stroke="#FEF3C7" stroke-width="2"/>

  <!-- Hammock Woven Mesh / Netting in Macrame Swag -->
  <path d="M 52 90 Q 150 140 248 90" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 110 Q 150 160 248 110" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 130 Q 150 180 248 130" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 150 Q 150 200 248 150" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 170 Q 150 220 248 170" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 190 Q 150 238 248 190" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>
  <path d="M 52 210 Q 150 255 248 210" fill="none" stroke="url(#threadGrad)" stroke-width="3"/>

  <!-- Cross weaves -->
  <path d="M 90 98 Q 110 160 100 225" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 130 108 Q 150 170 140 245" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 170 108 Q 190 170 180 245" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 210 98 Q 230 160 220 225" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Decorative Hanging Fringe (Flecos de Monimbó) -->
  <path d="M 55 212 L 65 265 M 85 220 L 95 272 M 115 228 L 125 280 M 145 235 L 155 285 M 175 235 L 185 285 M 205 228 L 215 280 M 235 220 L 245 272" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
