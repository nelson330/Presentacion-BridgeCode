<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular halo -->
  <circle cx="150" cy="150" r="100" fill="#D97706" opacity="0.1"/>
  
  <!-- Jaguar Precolumbian Pottery Vessel -->
  <ellipse cx="150" cy="80" rx="45" ry="14" fill="#475569" stroke="url(#gold)" stroke-width="2"/>
  <path d="M 105 80 Q 80 120 70 170 Q 60 220 120 240 Q 150 248 180 240 Q 240 220 230 170 Q 220 120 195 80 Z" fill="url(#potGrad)" stroke="url(#gold)" stroke-width="3"/>
  <ellipse cx="150" cy="235" rx="35" ry="8" fill="#0F172A"/>
  
  <!-- Jaguar Spots and Geometric Engravings -->
  <circle cx="120" cy="140" r="7" fill="#F59E0B" opacity="0.9"/>
  <circle cx="120" cy="140" r="3" fill="#1E293B"/>
  
  <circle cx="180" cy="140" r="7" fill="#F59E0B" opacity="0.9"/>
  <circle cx="180" cy="140" r="3" fill="#1E293B"/>
  
  <circle cx="150" cy="170" r="9" fill="#F59E0B" opacity="0.9"/>
  <circle cx="150" cy="170" r="4" fill="#1E293B"/>

  <circle cx="110" cy="195" r="6" fill="#F59E0B" opacity="0.9"/>
  <circle cx="190" cy="195" r="6" fill="#F59E0B" opacity="0.9"/>
  
  <path d="M 100 110 L 150 95 L 200 110" fill="none" stroke="#FDE68A" stroke-width="2"/>
  
  <!-- Highlight shine -->
  <path d="M 110 130 Q 95 160 100 190" fill="none" stroke="#94A3B8" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
</svg>
